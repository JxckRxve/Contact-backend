services:
  - type: web
    name: contact-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: ""
    startCommand: node gos-server.js
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: "902102344"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: MESSAGE_LIMIT_PER_HOUR
        value: "30"
      - key: LLM_ENDPOINT
        value: https://api.openai.com/v1/responses
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-5.6-luna
      - key: LLM_KIND
        value: openai-responses
      - key: GOS_DB_PATH
        value: /opt/render/project/src/gos-data.json
