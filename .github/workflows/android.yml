name: Build G-OS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOS_VERSION_CODE: ${{ github.run_number }}
      GOS_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore stable G-OS dev signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gos-android-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk G-OS-dev-${GOS_VERSION_CODE}.apk

      - name: Verify signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs G-OS-dev-${GOS_VERSION_CODE}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-OS-dev-${{ github.run_number }}-apk
          path: G-OS-dev-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
