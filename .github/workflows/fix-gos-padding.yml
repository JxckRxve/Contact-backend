name: Fix G-OS Android padding

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-gos-padding.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix invalid Compose PaddingValues calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/jrstudio/svyazsbogom/ui/GosRootApp.kt')
          s = p.read_text()
          s2 = s.replace(
              'PaddingValues(vertical = 12.dp, bottom = 30.dp)',
              'PaddingValues(start = 0.dp, top = 12.dp, end = 0.dp, bottom = 30.dp)'
          ).replace(
              'PaddingValues(vertical = 8.dp, bottom = 30.dp)',
              'PaddingValues(start = 0.dp, top = 8.dp, end = 0.dp, bottom = 30.dp)'
          )
          if s2 == s:
              raise SystemExit('Expected PaddingValues patterns not found')
          p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          git config user.name 'G-OS Builder'
          git config user.email 'contact-builder@users.noreply.github.com'
          git add app/src/main/java/com/jrstudio/svyazsbogom/ui/GosRootApp.kt
          git commit -m 'Fix G-OS Compose padding constructors'
          git push origin main
