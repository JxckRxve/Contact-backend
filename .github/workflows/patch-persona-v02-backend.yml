name: Patch Persona System v0.2 backend

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-persona-v02-backend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Persona edit clone archive backend
        run: python -c "import base64;exec(base64.b64decode('(req.method==="POST"&&url.pathname==="/api/gos/personas"){const out=createPersona(id,b);return json(res,out.ok?201:400,out);}if(req.method==="GET"&&url.pathname==="/api/gos/model-providers")'))"
      - name: Syntax check patched backend
        run: |
          node --check gos/standalone.js
          node --check gos/core.js
          node --check tests/gos-core-smoke.js
      - name: Commit backend patch
        run: |
          git config user.name 'G-OS Builder'
          git config user.email 'contact-builder@users.noreply.github.com'
          git add gos/standalone.js gos/core.js tests/gos-core-smoke.js
          git commit -m 'Add Persona edit clone archive backend'
          git push origin main
