name: Smoke G-OS Production

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'gos-server.js'
      - 'gos/**'
      - 'render.yaml'
      - 'package.json'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://contact-backend-u3ug.onrender.com
    steps:
      - name: Core deploy is reachable
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 18); do
            if curl -fsS --max-time 20 "$BASE_URL/health" > /tmp/health.json; then
              if grep -q '"ok":true' /tmp/health.json; then ready=1; break; fi
            fi
            sleep 10
          done
          test "$ready" = "1"

          ID=$(cat /proc/sys/kernel/random/uuid)
          SECRET="$(cat /proc/sys/kernel/random/uuid)$(cat /proc/sys/kernel/random/uuid)"
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "SECRET=$SECRET" >> "$GITHUB_ENV"
          QID=$(printf '%s' "$ID" | jq -sRr @uri)
          QSECRET=$(printf '%s' "$SECRET" | jq -sRr @uri)
          echo "QID=$QID" >> "$GITHUB_ENV"
          echo "QSECRET=$QSECRET" >> "$GITHUB_ENV"

          curl -fsS --max-time 30 "$BASE_URL/api/gos/state?conversationId=$QID&installSecret=$QSECRET" > /tmp/state.json
          node -e 'const x=require("/tmp/state.json"); if(!x.ok || !x.counts || x.counts.spaces < 1) process.exit(1)'

          curl -fsS --max-time 30 "$BASE_URL/api/gos/spaces?conversationId=$QID&installSecret=$QSECRET" > /tmp/spaces.json
          HOME_ID=$(node -e 'const x=require("/tmp/spaces.json"); const s=(x.items||[]).find(v=>v.key==="HOME"); if(!s) process.exit(2); process.stdout.write(s.id)')
          echo "HOME_ID=$HOME_ID" >> "$GITHUB_ENV"

      - name: Real AI provider is configured
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE_URL/api/gos/model-providers?conversationId=$QID&installSecret=$QSECRET" > /tmp/providers.json
          cat /tmp/providers.json
          node - <<'NODE'
          const x = require('/tmp/providers.json');
          const configured = (x.items || []).filter(p => p.configured);
          console.log(`CONFIGURED_PROVIDERS=${configured.length}`);
          if (!configured.length) {
            console.error('NO_CONFIGURED_AI_PROVIDER');
            process.exit(3);
          }
          console.log(configured.map(p => `${p.id}:${p.model}`).join(','));
          NODE

      - name: Full Task Result Memory Experience Fitness loop
        run: |
          set -euo pipefail
          jq -n \
            --arg conversationId "$ID" \
            --arg installSecret "$SECRET" \
            --arg spaceId "$HOME_ID" \
            '{conversationId:$conversationId,installSecret:$installSecret,spaceId:$spaceId,name:"Production Smoke",role:"tester",personality:"Minimal production verification persona."}' \
            > /tmp/persona-request.json
          curl -fsS --max-time 30 -H 'Content-Type: application/json' -d @/tmp/persona-request.json "$BASE_URL/api/gos/personas" > /tmp/persona.json
          PERSONA_ID=$(node -e 'const x=require("/tmp/persona.json"); if(!x.ok || !x.persona || !x.persona.id) process.exit(1); process.stdout.write(x.persona.id)')

          jq -n \
            --arg conversationId "$ID" \
            --arg installSecret "$SECRET" \
            --arg spaceId "$HOME_ID" \
            --arg personaId "$PERSONA_ID" \
            '{conversationId:$conversationId,installSecret:$installSecret,spaceId:$spaceId,personaId:$personaId,input:"Reply with exactly: GOS_PRODUCTION_OK",quality:"auto"}' \
            > /tmp/task-request.json
          curl -fsS --max-time 90 -H 'Content-Type: application/json' -d @/tmp/task-request.json "$BASE_URL/api/gos/tasks/run" > /tmp/task.json
          cat /tmp/task.json
          node - <<'NODE'
          const x = require('/tmp/task.json');
          if (!x.ok) process.exit(1);
          if (!x.task || x.task.status !== 'completed' || !x.task.result) process.exit(2);
          if (!x.memory || !x.experience || !x.fitness) process.exit(3);
          if (Number(x.fitness.success) !== 1) process.exit(4);
          console.log('PRODUCTION_GOS_FULL_LOOP_OK');
          NODE
