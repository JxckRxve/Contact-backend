name: Patch Persona System v0.2 UI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-persona-v02-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Persona action controls into cards
        run: python scripts/patch_persona_v02_ui.py
      - name: Commit UI patch
        run: |
          git config user.name 'G-OS Builder'
          git config user.email 'contact-builder@users.noreply.github.com'
          git add app/src/main/java/com/jrstudio/svyazsbogom/ui/GosRootApp.kt
          git commit -m 'Connect Persona edit clone archive controls'
          git push origin main
