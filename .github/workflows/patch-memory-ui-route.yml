name: Patch Memory Core Android route

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-memory-ui-route.py'
      - '.github/workflows/patch-memory-ui-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire Memory Core screen into G-OS shell
        run: python scripts/patch-memory-ui-route.py
      - name: Commit Android route
        run: |
          git config user.name 'G-OS Builder'
          git config user.email 'contact-builder@users.noreply.github.com'
          git add app/src/main/java/com/jrstudio/svyazsbogom/ui/GosRootApp.kt
          git commit -m 'Wire Memory Core v0.1 Android screen'
          git push origin main
